<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans Thai','Inter',system-ui,sans-serif;}
</style>
</helmet>
<div style="display:flex;height:100vh;min-height:0;background:{{ bg }};color:{{ fg }};font-family:'IBM Plex Sans Thai','Inter',sans-serif;">
  <aside style="width:230px;flex-shrink:0;border-right:1px solid {{ border }};background:{{ panel }};display:flex;flex-direction:column;min-height:0;">
    <div style="padding:16px 16px 12px;border-bottom:1px solid {{ border }};">
      <div style="font-size:9.5px;font-weight:700;letter-spacing:.6px;color:{{ acc }};">L1 · SALE</div>
      <div style="font-size:14.5px;font-weight:800;margin-top:3px;letter-spacing:-.2px;">ระบบบริหารการขาย</div>
      <div style="font-size:10.5px;color:{{ sub }};margin-top:2px;">Sales Management System</div>
    </div>
    <div style="flex:1;overflow:auto;padding:8px;min-height:0;">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
        <div style="margin:6px 6px 2px;">
          <span style="font-size:9px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:5px;background:{{ g.badgeBg }};color:{{ g.badgeFg }};">{{ g.label }}</span>
        </div>
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
          <button onClick="{{ it.onClick }}" style="{{ it.style }}">
            <span style="font-size:12.5px;font-weight:{{ it.weight }};">{{ it.th }}</span>
            <span style="display:flex;align-items:center;gap:6px;">
              <sc-if value="{{ it.dis }}" hint-placeholder-val="{{ false }}">
                <span style="font-size:8px;font-weight:700;letter-spacing:.4px;padding:2px 5px;border-radius:5px;background:#e5484d;color:#fff;">ปิด</span>
              </sc-if>
              <sc-if value="{{ it.hid }}" hint-placeholder-val="{{ false }}">
                <span style="font-size:8px;font-weight:700;letter-spacing:.4px;padding:2px 5px;border-radius:5px;background:{{ border }};color:{{ sub }};">HIDDEN</span>
              </sc-if>
              <span style="font-size:9.5px;font-weight:700;color:{{ it.abbrColor }};">{{ it.abbr }}</span>
            </span>
          </button>
        </sc-for>
      </sc-for>
    </div>
  </aside>
  <main style="flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;">
    <sc-if value="{{ is_cust }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SALE-CM" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.cust.onCatalog }}" on-mode="{{ handlers.cust.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_quot }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SALE-QT" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.quot.onCatalog }}" on-mode="{{ handlers.quot.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_sord }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SALE-SO" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.sord.onCatalog }}" on-mode="{{ handlers.sord.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_delv }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SALE-DO" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.delv.onCatalog }}" on-mode="{{ handlers.delv.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_sinv }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SALE-SI" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.sinv.onCatalog }}" on-mode="{{ handlers.sinv.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_sret }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SALE-SRN" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.sret.onCatalog }}" on-mode="{{ handlers.sret.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_pric }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SALE-PL" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.pric.onCatalog }}" on-mode="{{ handlers.pric.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_prom }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SALE-PM" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.prom.onCatalog }}" on-mode="{{ handlers.prom.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_comm }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SALE-COM" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.comm.onCatalog }}" on-mode="{{ handlers.comm.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_crm }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SALE-CRM" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.crm.onCatalog }}" on-mode="{{ handlers.crm.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_pos }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SALE-POS" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.pos.onCatalog }}" on-mode="{{ handlers.pos.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_ecom }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SALE-EC" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.ecom.onCatalog }}" on-mode="{{ handlers.ecom.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_mktp }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SALE-MP" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.mktp.onCatalog }}" on-mode="{{ handlers.mktp.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_cport }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SALE-CP" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.cport.onCatalog }}" on-mode="{{ handlers.cport.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_loyl }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SALE-LM" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.loyl.onCatalog }}" on-mode="{{ handlers.loyl.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_rpta }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SALE-RPTA" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.rpta.onCatalog }}" on-mode="{{ handlers.rpta.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ hasConfirm }}" hint-placeholder-val="{{ false }}">
      <div style="position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,0.32);display:flex;align-items:center;justify-content:center;padding:20px;">
        <div style="background:{{ panel }};border-radius:14px;border:1px solid {{ border }};box-shadow:0 20px 60px rgba(0,0,0,0.25);width:400px;max-width:100%;padding:22px 24px;">
          <div style="font-size:15.5px;font-weight:800;margin-bottom:10px;">ออกจากหน้านี้โดยไม่บันทึก?</div>
          <div style="font-size:12.5px;color:{{ sub }};line-height:1.6;margin-bottom:18px;">โมดูล {{ confirmFromTh }} มีการแก้ไขที่ยังไม่ได้บันทึก การสลับไปยัง {{ confirmToTh }} จะละทิ้งการเปลี่ยนแปลงนี้</div>
          <div style="display:flex;justify-content:flex-end;gap:8px;">
            <button onClick="{{ cancelSwitch }}" style="padding:8px 16px;border-radius:9px;border:1px solid {{ border }};background:{{ panel }};color:{{ fg }};font-weight:600;font-size:12.5px;cursor:pointer;font-family:inherit;">ยกเลิก</button>
            <button onClick="{{ confirmSwitchAction }}" style="padding:8px 16px;border-radius:9px;border:none;background:{{ acc }};color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;">ไม่บันทึกและสลับ</button>
          </div>
        </div>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;theme&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;api&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;win&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  state = { active: 'sale-cust', catalogs: {}, modes: {}, confirm: null };
  MODKEYS = { 'sale-cust':'cust','sale-quot':'quot','sale-sord':'sord','sale-delv':'delv','sale-sinv':'sinv','sale-sret':'sret','sale-pric':'pric','sale-prom':'prom','sale-comm':'comm','sale-crm':'crm','sale-pos':'pos','sale-ecom':'ecom','sale-mktp':'mktp','sale-cport':'cport','sale-loyl':'loyl','sale-rpta':'rpta' };
  BUILT = ['sale-cust','sale-quot','sale-sord','sale-delv','sale-sinv','sale-sret','sale-pric','sale-prom','sale-comm','sale-crm','sale-pos','sale-ecom','sale-mktp','sale-cport','sale-loyl','sale-rpta'];
  _handlers = {};
  mkHandlers(key) {
    if (this._handlers[key]) return this._handlers[key];
    const h = {
      onCatalog: (cat) => this.setState(s => ({ catalogs: Object.assign({}, s.catalogs, { [key]: cat }) })),
      onMode: (m) => this.setState(s => ({ modes: Object.assign({}, s.modes, { [key]: m }) })),
    };
    this._handlers[key] = h;
    return h;
  }
  requestSwitch(id) {
    if (id === this.state.active) return;
    const curKey = this.MODKEYS[this.state.active];
    const dirty = curKey && (this.state.modes[curKey] === 'create' || this.state.modes[curKey] === 'edit');
    if (dirty) this.setState({ confirm: id }); else this.setState({ active: id });
  }
  confirmSwitch() { const id = this.state.confirm; this.setState({ active: id, confirm: null }); }
  cancelSwitch() { this.setState({ confirm: null }); }

  // ---- SALE submodule registry (mirrors Shell's MODULES/SALE_GEN) ----
  SUBS() {
    return [
      ['sale-cust','CM','บริหารลูกค้า','core',false,false],
      ['sale-quot','QT','ใบเสนอราคา','core',false,false],
      ['sale-sord','SO','ใบสั่งขาย','core',false,false],
      ['sale-delv','DO','จัดส่งสินค้า','core',false,false],
      ['sale-sinv','SI','ใบแจ้งหนี้ขาย','core',false,false],
      ['sale-sret','SRN','รับคืนสินค้า','core',false,false],
      ['sale-pric','PL','บริหารราคาสินค้า','core',false,false],
      ['sale-prom','PM','บริหารโปรโมชั่น','core',false,false],
      ['sale-comm','COM','บริหารค่าคอมมิชชั่น','core',false,false],
      ['sale-crm','CRM','บริหารความสัมพันธ์ลูกค้า','core',false,false],
      ['sale-pos','POS','ขายหน้าร้าน','ext',false,false],
      ['sale-ecom','EC','ร้านค้าออนไลน์','ext',false,false],
      ['sale-mktp','MP','เชื่อมต่อ Marketplace','ext',false,false],
      ['sale-cport','CP','พอร์ทัลลูกค้า','ext',false,false],
      ['sale-loyl','LM','สมาชิกและสะสมแต้ม','ext',false,false],
      ['sale-rpta','RPTA','รายงานและการวิเคราะห์','report',false,false],
    ];
  }

  T() { return this.props.theme || {}; }

  renderVals() {
    const T = this.T();
    const dark = T.name === 'dark';
    const acc = T.acc || 'oklch(0.55 0.16 255)';
    const bg = T.bg || (dark ? 'oklch(0.19 0.012 265)' : 'oklch(0.98 0.004 255)');
    const panel = T.card || (dark ? 'oklch(0.23 0.014 265)' : '#fff');
    const fg = T.text || (dark ? 'oklch(0.94 0.01 265)' : 'oklch(0.25 0.02 265)');
    const sub = T.sub || (dark ? 'oklch(0.68 0.02 265)' : 'oklch(0.55 0.02 265)');
    const border = T.border || (dark ? 'oklch(0.32 0.014 265)' : 'oklch(0.9 0.006 255)');
    const accSoft = T.accSoft || (dark ? 'rgba(120,160,255,.16)' : 'rgba(60,110,240,.10)');

    const TYPE = {
      core:   ['Core Functions', dark?'rgba(90,140,255,.18)':'oklch(0.95 0.05 220)', dark?'oklch(0.8 0.1 220)':'oklch(0.45 0.15 220)'],
      ext:    ['Extensions',     dark?'rgba(80,200,140,.18)':'oklch(0.95 0.05 158)', dark?'oklch(0.82 0.1 158)':'oklch(0.45 0.15 158)'],
      report: ['Reports & Analytics', dark?'rgba(240,180,90,.18)':'oklch(0.95 0.05 35)', dark?'oklch(0.84 0.1 60)':'oklch(0.5 0.15 45)'],
    };
    const subs = this.SUBS();
    const active = this.state.active;
    const showHidden = this.props.showHidden !== undefined ? !!this.props.showHidden : true;
    const mk = (mt) => subs.filter(s => s[3] === mt && (showHidden || !s[4])).map(([id, abbr, th, , hid, dis]) => {
      const on = id === active;
      return {
        th, abbr, hid: !!hid, dis: !!dis,
        weight: on ? 700 : 500,
        abbrColor: on ? acc : sub,
        style: `display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:none;cursor:pointer;font-family:inherit;padding:8px 10px;border-radius:9px;margin:1px 0;color:${on?fg:sub};background:${on?accSoft:'transparent'};opacity:${dis?0.5:(hid?0.62:1)};`,
        onClick: () => this.requestSwitch(id),
      };
    });
    const groups = [['core'],['ext'],['report']].map(([mt]) => ({
      label: TYPE[mt][0], badgeBg: TYPE[mt][1], badgeFg: TYPE[mt][2], items: mk(mt),
    })).filter(g => g.items.length);

    const cur = subs.find(s => s[0] === active) || subs[0];
    const api = this.props.api || {};
    const handlers = {};
    Object.keys(this.MODKEYS).forEach(k => { handlers[this.MODKEYS[k]] = this.mkHandlers(this.MODKEYS[k]); });
    const confirmId = this.state.confirm;
    const confirmFrom = confirmId ? (subs.find(s => s[0] === active) || subs[0]) : null;
    const confirmTo = confirmId ? (subs.find(s => s[0] === confirmId) || subs[0]) : null;
    return {
      handlers,
      hasConfirm: !!confirmId,
      confirmFromTh: confirmFrom ? confirmFrom[2] : '',
      confirmToTh: confirmTo ? confirmTo[2] : '',
      cancelSwitch: () => this.cancelSwitch(),
      confirmSwitchAction: () => this.confirmSwitch(),
      bg, fg, sub, panel, border, acc,
      groups,
      themeName: T.name || '(ยังไม่ได้ส่ง theme)',
      activeTh: cur[2],
      activeAbbr: cur[1],
      activeCrumb: 'L1 · SALE › L2 · ' + ({core:'Core Functions',ext:'Extensions',report:'Reports & Analytics'}[cur[3]]) + ' › L3 · ' + cur[2],
      is_cust: active === 'sale-cust',
      is_quot: active === 'sale-quot',
      is_sord: active === 'sale-sord',
      is_delv: active === 'sale-delv',
      is_sinv: active === 'sale-sinv',
      is_sret: active === 'sale-sret',
      is_pric: active === 'sale-pric',
      is_prom: active === 'sale-prom',
      is_comm: active === 'sale-comm',
      is_crm: active === 'sale-crm',
      is_pos: active === 'sale-pos',
      is_ecom: active === 'sale-ecom',
      is_mktp: active === 'sale-mktp',
      is_cport: active === 'sale-cport',
      is_loyl: active === 'sale-loyl',
      is_rpta: active === 'sale-rpta',
      showHidden,
      theme: this.props.theme,
      api: this.props.api,
      win: this.props.win,
    };
  }
}
</script>
</body>
</html>
