<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans Thai','Inter',system-ui,sans-serif;}
</style>
</helmet>
<div style="display:flex;height:100vh;min-height:0;background:{{ bg }};color:{{ fg }};font-family:'IBM Plex Sans Thai','Inter',sans-serif;">
  <aside style="width:230px;flex-shrink:0;border-right:1px solid {{ border }};background:{{ panel }};display:flex;flex-direction:column;min-height:0;">
    <div style="padding:16px 16px 12px;border-bottom:1px solid {{ border }};">
      <div style="font-size:9.5px;font-weight:700;letter-spacing:.6px;color:{{ acc }};">L1 · ADMS</div>
      <div style="font-size:14.5px;font-weight:800;margin-top:3px;letter-spacing:-.2px;">ระบบบริหารงานส่วนกลาง</div>
      <div style="font-size:10.5px;color:{{ sub }};margin-top:2px;">General Administration System</div>
    </div>
    <div style="flex:1;overflow:auto;padding:8px;min-height:0;">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
        <div style="margin:6px 6px 2px;">
          <span style="font-size:9px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:5px;background:{{ g.badgeBg }};color:{{ g.badgeFg }};">{{ g.label }}</span>
        </div>
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
          <button onClick="{{ it.onClick }}" style="{{ it.style }}">
            <span style="font-size:12.5px;font-weight:{{ it.weight }};">{{ it.th }}</span>
            <span style="display:flex;align-items:center;gap:6px;">
              <sc-if value="{{ it.dis }}" hint-placeholder-val="{{ false }}">
                <span style="font-size:8px;font-weight:700;letter-spacing:.4px;padding:2px 5px;border-radius:5px;background:#e5484d;color:#fff;">ปิด</span>
              </sc-if>
              <sc-if value="{{ it.hid }}" hint-placeholder-val="{{ false }}">
                <span style="font-size:8px;font-weight:700;letter-spacing:.4px;padding:2px 5px;border-radius:5px;background:{{ border }};color:{{ sub }};">HIDDEN</span>
              </sc-if>
              <span style="font-size:9.5px;font-weight:700;color:{{ it.abbrColor }};">{{ it.abbr }}</span>
            </span>
          </button>
        </sc-for>
      </sc-for>
    </div>
  </aside>
  <main style="flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;">
    <sc-if value="{{ is_dms }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-DMS" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.dms.onCatalog }}" on-mode="{{ handlers.dms.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_corr }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-CORR" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.corr.onCatalog }}" on-mode="{{ handlers.corr.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_meet }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-MEET" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.meet.onCatalog }}" on-mode="{{ handlers.meet.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_cal }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-CAL" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.cal.onCatalog }}" on-mode="{{ handlers.cal.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_task }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-TASK" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.task.onCatalog }}" on-mode="{{ handlers.task.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_aprv }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-APRV" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.aprv.onCatalog }}" on-mode="{{ handlers.aprv.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_wf }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-WF" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.wf.onCatalog }}" on-mode="{{ handlers.wf.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_noti }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-NOTI" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.noti.onCatalog }}" on-mode="{{ handlers.noti.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_ann }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-ANN" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.ann.onCatalog }}" on-mode="{{ handlers.ann.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_event }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-EVENT" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.event.onCatalog }}" on-mode="{{ handlers.event.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_room }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-ROOM" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.room.onCatalog }}" on-mode="{{ handlers.room.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_veh }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-VEH" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.veh.onCatalog }}" on-mode="{{ handlers.veh.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_asset }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-ASSET" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.asset.onCatalog }}" on-mode="{{ handlers.asset.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_fac }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-FAC" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.fac.onCatalog }}" on-mode="{{ handlers.fac.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_vis }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-VIS" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.vis.onCatalog }}" on-mode="{{ handlers.vis.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_mail }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-MAIL" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.mail.onCatalog }}" on-mode="{{ handlers.mail.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_form }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-FORM" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.form.onCatalog }}" on-mode="{{ handlers.form.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_pol }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-POL" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.pol.onCatalog }}" on-mode="{{ handlers.pol.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_kb }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-KB" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.kb.onCatalog }}" on-mode="{{ handlers.kb.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_arch }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-ARCH" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.arch.onCatalog }}" on-mode="{{ handlers.arch.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_esign }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-ESIGN" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.esign.onCatalog }}" on-mode="{{ handlers.esign.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_ecm }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-ECM" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.ecm.onCatalog }}" on-mode="{{ handlers.ecm.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_chat }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-CHAT" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.chat.onCatalog }}" on-mode="{{ handlers.chat.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_portal }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-PORTAL" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.portal.onCatalog }}" on-mode="{{ handlers.portal.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_mob }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-MOB" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.mob.onCatalog }}" on-mode="{{ handlers.mob.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_ai }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-AI" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.ai.onCatalog }}" on-mode="{{ handlers.ai.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_auto }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-AUTO" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.auto.onCatalog }}" on-mode="{{ handlers.auto.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_integ }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-INTEG" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.integ.onCatalog }}" on-mode="{{ handlers.integ.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_rpta }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ADMS-RPTA" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.rpta.onCatalog }}" on-mode="{{ handlers.rpta.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ hasConfirm }}" hint-placeholder-val="{{ false }}">
      <div style="position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,0.32);display:flex;align-items:center;justify-content:center;padding:20px;">
        <div style="background:{{ panel }};border-radius:14px;border:1px solid {{ border }};box-shadow:0 20px 60px rgba(0,0,0,0.25);width:400px;max-width:100%;padding:22px 24px;">
          <div style="font-size:15.5px;font-weight:800;margin-bottom:10px;">ออกจากหน้านี้โดยไม่บันทึก?</div>
          <div style="font-size:12.5px;color:{{ sub }};line-height:1.6;margin-bottom:18px;">โมดูล {{ confirmFromTh }} มีการแก้ไขที่ยังไม่ได้บันทึก การสลับไปยัง {{ confirmToTh }} จะละทิ้งการเปลี่ยนแปลงนี้</div>
          <div style="display:flex;justify-content:flex-end;gap:8px;">
            <button onClick="{{ cancelSwitch }}" style="padding:8px 16px;border-radius:9px;border:1px solid {{ border }};background:{{ panel }};color:{{ fg }};font-weight:600;font-size:12.5px;cursor:pointer;font-family:inherit;">ยกเลิก</button>
            <button onClick="{{ confirmSwitchAction }}" style="padding:8px 16px;border-radius:9px;border:none;background:{{ acc }};color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;">ไม่บันทึกและสลับ</button>
          </div>
        </div>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;theme&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;api&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;win&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  state = { active: 'adms-dms', catalogs: {}, modes: {}, confirm: null };
  MODKEYS = { 'adms-dms':'dms','adms-corr':'corr','adms-meet':'meet','adms-cal':'cal','adms-task':'task','adms-aprv':'aprv','adms-wf':'wf','adms-noti':'noti','adms-ann':'ann','adms-event':'event','adms-room':'room','adms-veh':'veh','adms-asset':'asset','adms-fac':'fac','adms-vis':'vis','adms-mail':'mail','adms-form':'form','adms-pol':'pol','adms-kb':'kb','adms-arch':'arch','adms-esign':'esign','adms-ecm':'ecm','adms-chat':'chat','adms-portal':'portal','adms-mob':'mob','adms-ai':'ai','adms-auto':'auto','adms-integ':'integ','adms-rpta':'rpta' };
  BUILT = ['adms-dms','adms-corr','adms-meet','adms-cal','adms-task','adms-aprv','adms-wf','adms-noti','adms-ann','adms-event','adms-room','adms-veh','adms-asset','adms-fac','adms-vis','adms-mail','adms-form','adms-pol','adms-kb','adms-arch','adms-esign','adms-ecm','adms-chat','adms-portal','adms-mob','adms-ai','adms-auto','adms-integ','adms-rpta'];
  _handlers = {};
  mkHandlers(key) {
    if (this._handlers[key]) return this._handlers[key];
    const h = {
      onCatalog: (cat) => this.setState(s => ({ catalogs: Object.assign({}, s.catalogs, { [key]: cat }) })),
      onMode: (m) => this.setState(s => ({ modes: Object.assign({}, s.modes, { [key]: m }) })),
    };
    this._handlers[key] = h;
    return h;
  }
  requestSwitch(id) {
    if (id === this.state.active) return;
    const curKey = this.MODKEYS[this.state.active];
    const dirty = curKey && (this.state.modes[curKey] === 'create' || this.state.modes[curKey] === 'edit');
    if (dirty) this.setState({ confirm: id }); else this.setState({ active: id });
  }
  confirmSwitch() { const id = this.state.confirm; this.setState({ active: id, confirm: null }); }
  cancelSwitch() { this.setState({ confirm: null }); }

  // ---- ADMS submodule registry (mirrors Shell's MODULES/ADMS_GEN) ----
  SUBS() {
    return [
      ['adms-dms','DMS','ระบบบริหารเอกสาร','core',false,false],
      ['adms-corr','CORR','ระบบบริหารหนังสือรับ-ส่ง','core',false,false],
      ['adms-meet','MEET','ระบบบริหารการประชุม','core',false,false],
      ['adms-cal','CAL','ระบบบริหารปฏิทินองค์กร','core',false,false],
      ['adms-task','TASK','ระบบบริหารงานและภารกิจ','core',false,false],
      ['adms-aprv','APRV','ระบบบริหารการอนุมัติ','core',false,false],
      ['adms-wf','WF','ระบบบริหารเวิร์กโฟลว์','core',false,false],
      ['adms-noti','NOTI','ระบบบริหารการแจ้งเตือน','core',false,false],
      ['adms-ann','ANN','ระบบบริหารประกาศองค์กร','core',false,false],
      ['adms-event','EVENT','ระบบบริหารกิจกรรม','core',false,false],
      ['adms-room','ROOM','ระบบจองห้องประชุม','core',false,false],
      ['adms-veh','VEH','ระบบบริหารยานพาหนะ','core',false,false],
      ['adms-asset','ASSET','ระบบบริหารครุภัณฑ์สำนักงาน','core',false,false],
      ['adms-fac','FAC','ระบบบริหารอาคารและสถานที่','core',false,false],
      ['adms-vis','VIS','ระบบบริหารผู้มาติดต่อ','core',false,false],
      ['adms-mail','MAIL','ระบบบริหารไปรษณีย์และพัสดุ','core',false,false],
      ['adms-form','FORM','ระบบบริหารแบบฟอร์มอิเล็กทรอนิกส์','core',false,false],
      ['adms-pol','POL','ระบบบริหารนโยบายองค์กร','core',false,false],
      ['adms-kb','KB','ระบบบริหารองค์ความรู้','core',false,false],
      ['adms-arch','ARCH','ระบบบริหารเอกสารเก็บถาวร','core',false,false],
      ['adms-esign','ESIGN','ระบบลายมือชื่ออิเล็กทรอนิกส์','ext',false,false],
      ['adms-ecm','ECM','ระบบบริหารเนื้อหาองค์กร','ext',false,false],
      ['adms-chat','CHAT','ระบบสื่อสารภายในองค์กร','ext',false,false],
      ['adms-portal','PORTAL','ระบบพอร์ทัลองค์กร','ext',false,false],
      ['adms-mob','MOB','ระบบบริหารผ่านอุปกรณ์เคลื่อนที่','ext',false,false],
      ['adms-ai','AI','ระบบผู้ช่วยอัจฉริยะ','ext',false,false],
      ['adms-auto','AUTO','ระบบอัตโนมัติกระบวนการ','ext',false,false],
      ['adms-integ','INTEG','ระบบเชื่อมต่อบริการภายนอก','ext',false,false],
      ['adms-rpta','RPTA','รายงานและการวิเคราะห์','report',false,false],
    ];
  }

  T() { return this.props.theme || {}; }

  renderVals() {
    const T = this.T();
    const dark = T.name === 'dark';
    const acc = T.acc || 'oklch(0.55 0.16 255)';
    const bg = T.bg || (dark ? 'oklch(0.19 0.012 265)' : 'oklch(0.98 0.004 255)');
    const panel = T.card || (dark ? 'oklch(0.23 0.014 265)' : '#fff');
    const fg = T.text || (dark ? 'oklch(0.94 0.01 265)' : 'oklch(0.25 0.02 265)');
    const sub = T.sub || (dark ? 'oklch(0.68 0.02 265)' : 'oklch(0.55 0.02 265)');
    const border = T.border || (dark ? 'oklch(0.32 0.014 265)' : 'oklch(0.9 0.006 255)');
    const accSoft = T.accSoft || (dark ? 'rgba(120,160,255,.16)' : 'rgba(60,110,240,.10)');

    const TYPE = {
      core:   ['Core Functions', dark?'rgba(90,140,255,.18)':'oklch(0.95 0.05 220)', dark?'oklch(0.8 0.1 220)':'oklch(0.45 0.15 220)'],
      ext:    ['Extensions',     dark?'rgba(80,200,140,.18)':'oklch(0.95 0.05 158)', dark?'oklch(0.82 0.1 158)':'oklch(0.45 0.15 158)'],
      report: ['Reports & Analytics', dark?'rgba(240,180,90,.18)':'oklch(0.95 0.05 35)', dark?'oklch(0.84 0.1 60)':'oklch(0.5 0.15 45)'],
    };
    const subs = this.SUBS();
    const active = this.state.active;
    const showHidden = this.props.showHidden !== undefined ? !!this.props.showHidden : true;
    const mk = (mt) => subs.filter(s => s[3] === mt && (showHidden || !s[4])).map(([id, abbr, th, , hid, dis]) => {
      const on = id === active;
      return {
        th, abbr, hid: !!hid, dis: !!dis,
        weight: on ? 700 : 500,
        abbrColor: on ? acc : sub,
        style: `display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:none;cursor:pointer;font-family:inherit;padding:8px 10px;border-radius:9px;margin:1px 0;color:${on?fg:sub};background:${on?accSoft:'transparent'};opacity:${dis?0.5:(hid?0.62:1)};`,
        onClick: () => this.requestSwitch(id),
      };
    });
    const groups = [['core'],['ext'],['report']].map(([mt]) => ({
      label: TYPE[mt][0], badgeBg: TYPE[mt][1], badgeFg: TYPE[mt][2], items: mk(mt),
    })).filter(g => g.items.length);

    const cur = subs.find(s => s[0] === active) || subs[0];
    const api = this.props.api || {};
    const handlers = {};
    Object.keys(this.MODKEYS).forEach(k => { handlers[this.MODKEYS[k]] = this.mkHandlers(this.MODKEYS[k]); });
    const confirmId = this.state.confirm;
    const confirmFrom = confirmId ? (subs.find(s => s[0] === active) || subs[0]) : null;
    const confirmTo = confirmId ? (subs.find(s => s[0] === confirmId) || subs[0]) : null;
    return {
      handlers,
      hasConfirm: !!confirmId,
      confirmFromTh: confirmFrom ? confirmFrom[2] : '',
      confirmToTh: confirmTo ? confirmTo[2] : '',
      cancelSwitch: () => this.cancelSwitch(),
      confirmSwitchAction: () => this.confirmSwitch(),
      bg, fg, sub, panel, border, acc,
      groups,
      themeName: T.name || '(ยังไม่ได้ส่ง theme)',
      activeTh: cur[2],
      activeAbbr: cur[1],
      activeCrumb: 'L1 · ADMS › L2 · ' + ({core:'Core Functions',ext:'Extensions',report:'Reports & Analytics'}[cur[3]]) + ' › L3 · ' + cur[2],
      is_dms: active === 'adms-dms',
      is_corr: active === 'adms-corr',
      is_meet: active === 'adms-meet',
      is_cal: active === 'adms-cal',
      is_task: active === 'adms-task',
      is_aprv: active === 'adms-aprv',
      is_wf: active === 'adms-wf',
      is_noti: active === 'adms-noti',
      is_ann: active === 'adms-ann',
      is_event: active === 'adms-event',
      is_room: active === 'adms-room',
      is_veh: active === 'adms-veh',
      is_asset: active === 'adms-asset',
      is_fac: active === 'adms-fac',
      is_vis: active === 'adms-vis',
      is_mail: active === 'adms-mail',
      is_form: active === 'adms-form',
      is_pol: active === 'adms-pol',
      is_kb: active === 'adms-kb',
      is_arch: active === 'adms-arch',
