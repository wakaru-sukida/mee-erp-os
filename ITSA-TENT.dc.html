  planHue(p) { return ({ 'Enterprise': 265, 'Professional': 200, 'Starter': 145 })[p] || 145; }

  curNav() { return this.props.nav || this.state.nav; }
  _setNav(id) { if (this.props.onNav) this.props.onNav(id); this.setState({ nav: id, scr: 'list', mode: 'view', edit: null, sel: null }); }
  setNav(id) { if (id !== this.curNav() && this.isDirty()) { this.askConfirm(() => this._setNav(id)); return; } this._setNav(id); }
  dbRows(key, seed) { const d = this.state.db[key]; return d !== undefined ? d : seed; }
  curScr() { return this.props.scr || this.state.scr; }
  curMode() { return this.state.mode; }
  isDirty() { const m = this.curMode(); return m === 'create' || m === 'edit'; }
  enterCreate() { this.setState({ mode: 'create', edit: null, draft: {} }); this._goScr('create'); }
  enterEdit(r) { this.setState({ mode: 'edit', edit: r, sel: r, draft: {} }); this._goScr('edit'); }
  _condMatch(cur, want) { return Array.isArray(want) ? want.indexOf(cur) >= 0 : cur === want; }
  _fieldVisible(cond, getVal) { if (!cond) return true; const pairs = Array.isArray(cond[0]) ? cond : [cond]; return pairs.every(p => this._condMatch(getVal(p[0]), p[1])); }
  _provIsApproved(r) { return !!(r && (this._isUuid(r.tent_id) || /อนุมัติแล้ว|จัดเตรียมเสร็จ|เสร็จสิ้น/.test(String(r.pstat || '')))); }
  approveProvisioning(r) {
    if (!r) return; const name = r.name_th || r.req_name || '';
    if (!name) { this.toast('คำขอนี้ยังไม่ได้ระบุผู้เช่า'); return; }
    if (this._provIsApproved(r)) { this.toast('คำขอนี้ถูกอนุมัติแล้ว'); return; }
    let tid = this._tentMaps().byName[name];
    this.setState(s => {
      const db = Object.assign({}, s.db);
      const mgmt = (db['tenant-management'] !== undefined ? db['tenant-management'] : (this.CFG()['tenant-management'].rows || [])).slice();
      if (!tid) {
        const codeNum = mgmt.reduce((mx, x) => Math.max(mx, this._digits(x.code) || 0), 0) + 1;
        const tentCode = 'TEN-' + String(codeNum).padStart(2, '0');
        tid = this._uuidFrom(tentCode);
        const row = { code: tentCode, name_th: name, name_en: '', plan_id: r.plan_id, plan: r.plan || this._planName(r.plan_id), tent_id: tid, status: 'Active' };
        this._syncPlan(row); this._stampAudit(row, true); mgmt.push(row); db['tenant-management'] = mgmt;
      }
      const prov = (db['tenant-provisioning'] !== undefined ? db['tenant-provisioning'] : (this.CFG()['tenant-provisioning'].rows || [])).map(x => {
        if (x === r || (x.code != null && x.code === r.code)) { const u = Object.assign({}, x, { tent_id: tid, pstat: 'อนุมัติแล้ว', status: 'Active' }); this._stampAudit(u, false); return u; }
        return x;
      });
      db['tenant-provisioning'] = prov;
      // auto-create default config + isolation for the new tenant (skip if a row for this tenant name already exists)
      const cfgRows = (db['tenant-configuration'] !== undefined ? db['tenant-configuration'] : (this.CFG()['tenant-configuration'].rows || [])).slice();
      if (!cfgRows.some(x => x && x.name_th === name)) { const cr = { name_th: name, tent_id: tid, tz: 'Asia/Bangkok', cur: 'THB', lang: 'ไทย', status: 'Active' }; this._stampAudit(cr, true); cfgRows.push(cr); db['tenant-configuration'] = cfgRows; }
      const isoRows = (db['tenant-isolation'] !== undefined ? db['tenant-isolation'] : (this.CFG()['tenant-isolation'].rows || [])).slice();
      if (!isoRows.some(x => x && x.name_th === name)) { const ir = { name_th: name, tent_id: tid, mode: 'Shared Schema', db: 'Google Sheet', partition_type: 'พาร์ทฐานข้อมูลแยกตามโมดูล', status: 'Active' }; this._stampAudit(ir, true); isoRows.push(ir); db['tenant-isolation'] = isoRows; }
      return { db, sel: Object.assign({}, r, { tent_id: tid, pstat: 'อนุมัติแล้ว', status: 'Active' }) };
    }, () => this.toast('อนุมัติคำขอแล้ว — สร้างผู้เช่า + ตั้งค่า + การแยกข้อมูล (ค่าเริ่มต้น) และออก Tenant ID (UUID)'));
