<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans Thai','Inter',system-ui,sans-serif;}
</style>
</helmet>
<div style="display:flex;height:100vh;min-height:0;background:{{ bg }};color:{{ fg }};font-family:'IBM Plex Sans Thai','Inter',sans-serif;">
  <aside style="width:230px;flex-shrink:0;border-right:1px solid {{ border }};background:{{ panel }};display:flex;flex-direction:column;min-height:0;">
    <div style="padding:16px 16px 12px;border-bottom:1px solid {{ border }};">
      <div style="font-size:9.5px;font-weight:700;letter-spacing:.6px;color:{{ acc }};">L1 · PROD</div>
      <div style="font-size:14.5px;font-weight:800;margin-top:3px;letter-spacing:-.2px;">ระบบบริหารการผลิต</div>
      <div style="font-size:10.5px;color:{{ sub }};margin-top:2px;">Production Management System</div>
    </div>
    <div style="flex:1;overflow:auto;padding:8px;min-height:0;">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
        <div style="margin:6px 6px 2px;">
          <span style="font-size:9px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:5px;background:{{ g.badgeBg }};color:{{ g.badgeFg }};">{{ g.label }}</span>
        </div>
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
          <button onClick="{{ it.onClick }}" style="{{ it.style }}">
            <span style="font-size:12.5px;font-weight:{{ it.weight }};">{{ it.th }}</span>
            <span style="display:flex;align-items:center;gap:6px;">
              <sc-if value="{{ it.dis }}" hint-placeholder-val="{{ false }}">
                <span style="font-size:8px;font-weight:700;letter-spacing:.4px;padding:2px 5px;border-radius:5px;background:#e5484d;color:#fff;">ปิด</span>
              </sc-if>
              <sc-if value="{{ it.hid }}" hint-placeholder-val="{{ false }}">
                <span style="font-size:8px;font-weight:700;letter-spacing:.4px;padding:2px 5px;border-radius:5px;background:{{ border }};color:{{ sub }};">HIDDEN</span>
              </sc-if>
              <span style="font-size:9.5px;font-weight:700;color:{{ it.abbrColor }};">{{ it.abbr }}</span>
            </span>
          </button>
        </sc-for>
      </sc-for>
    </div>
  </aside>
  <main style="flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;">
    <sc-if value="{{ is_bom }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-BOM" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.bom.onCatalog }}" on-mode="{{ handlers.bom.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_rout }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-ROUT" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.rout.onCatalog }}" on-mode="{{ handlers.rout.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_mps }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-MPS" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.mps.onCatalog }}" on-mode="{{ handlers.mps.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_mrp }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-MRP" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.mrp.onCatalog }}" on-mode="{{ handlers.mrp.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_wo }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-WO" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.wo.onCatalog }}" on-mode="{{ handlers.wo.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_iss }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-ISS" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.iss.onCatalog }}" on-mode="{{ handlers.iss.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_rec }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-REC" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.rec.onCatalog }}" on-mode="{{ handlers.rec.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_wip }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-WIP" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.wip.onCatalog }}" on-mode="{{ handlers.wip.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_sfc }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-SFC" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.sfc.onCatalog }}" on-mode="{{ handlers.sfc.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_capa }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-CAPA" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.capa.onCatalog }}" on-mode="{{ handlers.capa.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_labr }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-LABR" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.labr.onCatalog }}" on-mode="{{ handlers.labr.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_mach }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-MACH" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.mach.onCatalog }}" on-mode="{{ handlers.mach.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_scrp }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-SCRP" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.scrp.onCatalog }}" on-mode="{{ handlers.scrp.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_cost }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-COST" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.cost.onCatalog }}" on-mode="{{ handlers.cost.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_coby }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-COBY" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.coby.onCatalog }}" on-mode="{{ handlers.coby.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_btch }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-BTCH" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.btch.onCatalog }}" on-mode="{{ handlers.btch.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_seri }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-SERI" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.seri.onCatalog }}" on-mode="{{ handlers.seri.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_trce }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-TRCE" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.trce.onCatalog }}" on-mode="{{ handlers.trce.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_aps }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-APS" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.aps.onCatalog }}" on-mode="{{ handlers.aps.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_mes }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-MES" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.mes.onCatalog }}" on-mode="{{ handlers.mes.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_iot }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-IOT" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.iot.onCatalog }}" on-mode="{{ handlers.iot.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_oee }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-OEE" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.oee.onCatalog }}" on-mode="{{ handlers.oee.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_andn }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-ANDN" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.andn.onCatalog }}" on-mode="{{ handlers.andn.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_kanb }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-KANB" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.kanb.onCatalog }}" on-mode="{{ handlers.kanb.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_lean }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-LEAN" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.lean.onCatalog }}" on-mode="{{ handlers.lean.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_qms }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-QMS" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.qms.onCatalog }}" on-mode="{{ handlers.qms.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_eam }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-EAM" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.eam.onCatalog }}" on-mode="{{ handlers.eam.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_mob }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-MOB" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.mob.onCatalog }}" on-mode="{{ handlers.mob.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_rpta }}" hint-placeholder-val="{{ false }}">
      <dc-import name="PROD-RPTA" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.rpta.onCatalog }}" on-mode="{{ handlers.rpta.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ hasConfirm }}" hint-placeholder-val="{{ false }}">
      <div style="position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,0.32);display:flex;align-items:center;justify-content:center;padding:20px;">
        <div style="background:{{ panel }};border-radius:14px;border:1px solid {{ border }};box-shadow:0 20px 60px rgba(0,0,0,0.25);width:400px;max-width:100%;padding:22px 24px;">
          <div style="font-size:15.5px;font-weight:800;margin-bottom:10px;">ออกจากหน้านี้โดยไม่บันทึก?</div>
          <div style="font-size:12.5px;color:{{ sub }};line-height:1.6;margin-bottom:18px;">โมดูล {{ confirmFromTh }} มีการแก้ไขที่ยังไม่ได้บันทึก การสลับไปยัง {{ confirmToTh }} จะละทิ้งการเปลี่ยนแปลงนี้</div>
          <div style="display:flex;justify-content:flex-end;gap:8px;">
            <button onClick="{{ cancelSwitch }}" style="padding:8px 16px;border-radius:9px;border:1px solid {{ border }};background:{{ panel }};color:{{ fg }};font-weight:600;font-size:12.5px;cursor:pointer;font-family:inherit;">ยกเลิก</button>
            <button onClick="{{ confirmSwitchAction }}" style="padding:8px 16px;border-radius:9px;border:none;background:{{ acc }};color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;">ไม่บันทึกและสลับ</button>
          </div>
        </div>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;theme&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;api&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;win&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  state = { active: 'prod-bom', catalogs: {}, modes: {}, confirm: null };
  MODKEYS = { 'prod-bom':'bom','prod-rout':'rout','prod-mps':'mps','prod-mrp':'mrp','prod-wo':'wo','prod-iss':'iss','prod-rec':'rec','prod-wip':'wip','prod-sfc':'sfc','prod-capa':'capa','prod-labr':'labr','prod-mach':'mach','prod-scrp':'scrp','prod-cost':'cost','prod-coby':'coby','prod-btch':'btch','prod-seri':'seri','prod-trce':'trce','prod-aps':'aps','prod-mes':'mes','prod-iot':'iot','prod-oee':'oee','prod-andn':'andn','prod-kanb':'kanb','prod-lean':'lean','prod-qms':'qms','prod-eam':'eam','prod-mob':'mob','prod-rpta':'rpta' };
  BUILT = ['prod-bom','prod-rout','prod-mps','prod-mrp','prod-wo','prod-iss','prod-rec','prod-wip','prod-sfc','prod-capa','prod-labr','prod-mach','prod-scrp','prod-cost','prod-coby','prod-btch','prod-seri','prod-trce','prod-aps','prod-mes','prod-iot','prod-oee','prod-andn','prod-kanb','prod-lean','prod-qms','prod-eam','prod-mob','prod-rpta'];
  _handlers = {};
  mkHandlers(key) {
    if (this._handlers[key]) return this._handlers[key];
    const h = {
      onCatalog: (cat) => this.setState(s => ({ catalogs: Object.assign({}, s.catalogs, { [key]: cat }) })),
      onMode: (m) => this.setState(s => ({ modes: Object.assign({}, s.modes, { [key]: m }) })),
    };
    this._handlers[key] = h;
    return h;
  }
  requestSwitch(id) {
    if (id === this.state.active) return;
    const curKey = this.MODKEYS[this.state.active];
    const dirty = curKey && (this.state.modes[curKey] === 'create' || this.state.modes[curKey] === 'edit');
    if (dirty) this.setState({ confirm: id }); else this.setState({ active: id });
  }
  confirmSwitch() { const id = this.state.confirm; this.setState({ active: id, confirm: null }); }
  cancelSwitch() { this.setState({ confirm: null }); }

  // ---- PROD submodule registry (mirrors Shell's MODULES/PROD_GEN) ----
  SUBS() {
    return [
      ['prod-bom','BOM','ระบบโครงสร้างวัตถุดิบและส่วนประกอบ','core',false,false],
      ['prod-rout','ROUT','ระบบเส้นทางและขั้นตอนการผลิต','core',false,false],
      ['prod-mps','MPS','ระบบแผนการผลิตหลัก','core',false,false],
      ['prod-mrp','MRP','ระบบวางแผนความต้องการวัตถุดิบ','core',false,false],
      ['prod-wo','WO','ระบบจัดการใบสั่งผลิต','core',false,false],
      ['prod-iss','ISS','ระบบเบิกวัตถุดิบเข้าการผลิต','core',false,false],
      ['prod-rec','REC','ระบบรับสินค้าสำเร็จรูปจากการผลิต','core',false,false],
      ['prod-wip','WIP','ระบบติดตามงานระหว่างผลิต','core',false,false],
      ['prod-sfc','SFC','ระบบควบคุมการผลิตหน้างาน','core',false,false],
      ['prod-capa','CAPA','ระบบวางแผนกำลังการผลิต','core',false,false],
      ['prod-labr','LABR','ระบบติดตามแรงงานการผลิต','core',false,false],
      ['prod-mach','MACH','ระบบติดตามเครื่องจักรการผลิต','core',false,false],
      ['prod-scrp','SCRP','ระบบจัดการของเสียและงานแก้ไข','core',false,false],
      ['prod-cost','COST','ระบบคำนวณต้นทุนการผลิต','core',false,false],
      ['prod-coby','COBY','ระบบจัดการผลผลิตร่วมและผลพลอยได้','core',false,false],
      ['prod-btch','BTCH','ระบบการผลิตแบบแบตช์','core',false,false],
      ['prod-seri','SERI','ระบบการผลิตแบบ Serial','core',false,false],
      ['prod-trce','TRCE','ระบบติดตามย้อนกลับการผลิต','core',false,false],
      ['prod-aps','APS','ระบบวางแผนและจัดตารางการผลิตขั้นสูง','ext',false,false],
      ['prod-mes','MES','ระบบปฏิบัติการการผลิต','ext',false,false],
      ['prod-iot','IOT','ระบบเชื่อมต่อ IoT การผลิต','ext',false,false],
      ['prod-oee','OEE','ระบบวิเคราะห์ประสิทธิผลเครื่องจักร','ext',false,false],
      ['prod-andn','ANDN','ระบบแจ้งเตือนปัญหาหน้างาน','ext',false,false],
      ['prod-kanb','KANB','ระบบคัมบังและดึงการผลิต','ext',false,false],
      ['prod-lean','LEAN','ระบบการผลิตแบบลีน','ext',false,false],
      ['prod-qms','QMS','ระบบเชื่อมโยงงานคุณภาพ','ext',false,false],
      ['prod-eam','EAM','ระบบเชื่อมโยงการบำรุงรักษา','ext',false,false],
      ['prod-mob','MOB','ระบบการผลิตผ่านอุปกรณ์เคลื่อนที่','ext',false,false],
      ['prod-rpta','RPTA','รายงานและการวิเคราะห์','report',false,false],
    ];
  }

  T() { return this.props.theme || {}; }

  renderVals() {
    const T = this.T();
    const dark = T.name === 'dark';
    const acc = T.acc || 'oklch(0.55 0.16 255)';
    const bg = T.bg || (dark ? 'oklch(0.19 0.012 265)' : 'oklch(0.98 0.004 255)');
    const panel = T.card || (dark ? 'oklch(0.23 0.014 265)' : '#fff');
    const fg = T.text || (dark ? 'oklch(0.94 0.01 265)' : 'oklch(0.25 0.02 265)');
    const sub = T.sub || (dark ? 'oklch(0.68 0.02 265)' : 'oklch(0.55 0.02 265)');
    const border = T.border || (dark ? 'oklch(0.32 0.014 265)' : 'oklch(0.9 0.006 255)');
    const accSoft = T.accSoft || (dark ? 'rgba(120,160,255,.16)' : 'rgba(60,110,240,.10)');

    const TYPE = {
      core:   ['Core Functions', dark?'rgba(90,140,255,.18)':'oklch(0.95 0.05 220)', dark?'oklch(0.8 0.1 220)':'oklch(0.45 0.15 220)'],
      ext:    ['Extensions',     dark?'rgba(80,200,140,.18)':'oklch(0.95 0.05 158)', dark?'oklch(0.82 0.1 158)':'oklch(0.45 0.15 158)'],
      report: ['Reports & Analytics', dark?'rgba(240,180,90,.18)':'oklch(0.95 0.05 35)', dark?'oklch(0.84 0.1 60)':'oklch(0.5 0.15 45)'],
    };
    const subs = this.SUBS();
    const active = this.state.active;
    const showHidden = this.props.showHidden !== undefined ? !!this.props.showHidden : true;
    const mk = (mt) => subs.filter(s => s[3] === mt && (showHidden || !s[4])).map(([id, abbr, th, , hid, dis]) => {
      const on = id === active;
      return {
        th, abbr, hid: !!hid, dis: !!dis,
        weight: on ? 700 : 500,
        abbrColor: on ? acc : sub,
        style: `display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:none;cursor:pointer;font-family:inherit;padding:8px 10px;border-radius:9px;margin:1px 0;color:${on?fg:sub};background:${on?accSoft:'transparent'};opacity:${dis?0.5:(hid?0.62:1)};`,
        onClick: () => this.requestSwitch(id),
      };
    });
    const groups = [['core'],['ext'],['report']].map(([mt]) => ({
      label: TYPE[mt][0], badgeBg: TYPE[mt][1], badgeFg: TYPE[mt][2], items: mk(mt),
    })).filter(g => g.items.length);

    const cur = subs.find(s => s[0] === active) || subs[0];
    const api = this.props.api || {};
    const handlers = {};
    Object.keys(this.MODKEYS).forEach(k => { handlers[this.MODKEYS[k]] = this.mkHandlers(this.MODKEYS[k]); });
    const confirmId = this.state.confirm;
    const confirmFrom = confirmId ? (subs.find(s => s[0] === active) || subs[0]) : null;
    const confirmTo = confirmId ? (subs.find(s => s[0] === confirmId) || subs[0]) : null;
    return {
      handlers,
      hasConfirm: !!confirmId,
      confirmFromTh: confirmFrom ? confirmFrom[2] : '',
      confirmToTh: confirmTo ? confirmTo[2] : '',
      cancelSwitch: () => this.cancelSwitch(),
      confirmSwitchAction: () => this.confirmSwitch(),
      bg, fg, sub, panel, border, acc,
      groups,
      themeName: T.name || '(ยังไม่ได้ส่ง theme)',
      activeTh: cur[2],
      activeAbbr: cur[1],
      activeCrumb: 'L1 · PROD › L2 · ' + ({core:'Core Functions',ext:'Extensions',report:'Reports & Analytics'}[cur[3]]) + ' › L3 · ' + cur[2],
      is_bom: active === 'prod-bom',
      is_rout: active === 'prod-rout',
      is_mps: active === 'prod-mps',
      is_mrp: active === 'prod-mrp',
      is_wo: active === 'prod-wo',
      is_iss: active === 'prod-iss',
      is_rec: active === 'prod-rec',
      is_wip: active === 'prod-wip',
      is_sfc: active === 'prod-sfc',
      is_capa: active === 'prod-capa',
      is_labr: active === 'prod-labr',
