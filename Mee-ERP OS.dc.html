function srvcFnIcon(en){ const s=en.toLowerCase();
  if(/dashboard|report|analytic|kpi|monitor|summary|performance/.test(s))return'reports';
  if(/schedul|calendar|appoint|book|reminder|resched|milestone|planning|plan/.test(s))return'calendar';
  if(/assign|technician|dispatch|resource|capacity/.test(s))return'user';
  if(/approv|accept|complet|close|checklist|signature|resolution/.test(s))return'check';
  if(/track|progress|status|escalat|lifecycle/.test(s))return'gauge';
  if(/contract|warrant|amc|policy|sla/.test(s))return'scale';
  if(/bill|invoice|cost|expense|credit|budget|pricing|price/.test(s))return'cash';
  if(/time|timesheet/.test(s))return'clock';
  if(/material|spare|item|package|project/.test(s))return'box';
  if(/gps|route|field|offline|mobile/.test(s))return'car';
  if(/photo|upload|document|article|sop|knowledge|faq|troubleshoot/.test(s))return'doc';
  if(/ticket/.test(s))return'tag';
  if(/incident|remote|support|help|chat|survey|customer|portal|submit|contact|category|management/.test(s))return'crm';
  if(/requisition|quotation|rfq|proposal|library|article|submission|announcement|version|archive|signature|attachment/.test(s))return'doc';
  if(/receiv|inspection|put|return|shipment|goods/.test(s))return'return';
  if(/vendor|supplier|registration|delegation|qualification/.test(s))return'crm';
  if(/tender|bid|auction|award|evaluation/.test(s))return'gauge';
  if(/order/.test(s))return'cart';
  return'list';
}

function tokens(theme, accentHue, surface, tintWin){
  const t = baseTokens(theme, accentHue);
  t.surface = surface||'flat';
  if(t.name==='dark'){
    const Hs = accentHue==null?260:accentHue, Cs = accentHue==null?0.01:0.07;
    t.accSoft = `oklch(0.32 ${Cs} ${Hs})`;
    t.accText = accentHue==null?'oklch(0.9 0.01 260)':`oklch(0.82 0.13 ${Hs})`;
  }
  if(accentHue!=null && theme!=='minimal' && theme!=='minimal-dark' && tintWin!==false){
    const H=accentHue;
    if(t.name==='dark'){
      t.win='oklch(0.225 0.022 '+H+')'; t.winHead='oklch(0.27 0.038 '+H+')';
      t.card='oklch(0.255 0.02 '+H+')'; t.field='oklch(0.2 0.02 '+H+')';
      t.border='oklch(0.34 0.03 '+H+')'; t.line='oklch(0.31 0.025 '+H+')'; t.hover='oklch(0.3 0.032 '+H+')';
      t.bar='oklch(0.21 0.022 '+H+' / .82)'; t.bodyBg='oklch(0.205 0.012 '+H+')';
    } else {
      t.win='oklch(1 0 0)'; t.winHead='oklch(0.968 0.022 '+H+')';
      t.card='oklch(1 0 0)'; t.field='oklch(0.986 0.009 '+H+')';
      t.border='oklch(0.905 0.015 '+H+')'; t.line='oklch(0.94 0.009 '+H+')'; t.hover='oklch(0.96 0.014 '+H+')';
      t.bar='oklch(0.995 0.008 '+H+' / .8)'; t.bodyBg='oklch(0.992 0.005 '+H+')';
    }
  }
  t.winSolid = t.win; t.winHeadSolid = t.winHead; t.cardSolid = t.card; t.fieldSolid = t.field;
  const sh = accentHue==null ? 250 : accentHue;
  t.accShadow = `0 6px 18px -6px oklch(0.55 0.14 ${sh} / .42)`;
  if(surface==='glass'){
    t.blur='blur(24px) saturate(1.4)'; t.glass=true;
    t.shadow=`0 18px 55px -10px oklch(0.5 0.15 ${sh} / ${t.name==='dark'?'.5':'.34'}), inset 0 1px 0 rgba(255,255,255,${t.name==='dark'?'.06':'.5'})`;
    t.shadowUnfocused=`0 8px 26px -10px oklch(0.5 0.13 ${sh} / .28)`;
    t.border = t.name==='dark'?'oklch(0.5 0.01 265 / .35)':'oklch(1 0 0 / .55)';
  } else {
    t.shadow='none'; t.shadowUnfocused='none';
  }
  return t;
}
