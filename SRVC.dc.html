<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans Thai','Inter',system-ui,sans-serif;}
</style>
</helmet>
<div style="display:flex;height:100vh;min-height:0;background:{{ bg }};color:{{ fg }};font-family:'IBM Plex Sans Thai','Inter',sans-serif;">
  <aside style="width:230px;flex-shrink:0;border-right:1px solid {{ border }};background:{{ panel }};display:flex;flex-direction:column;min-height:0;">
    <div style="padding:16px 16px 12px;border-bottom:1px solid {{ border }};">
      <div style="font-size:9.5px;font-weight:700;letter-spacing:.6px;color:{{ acc }};">L1 · SRVC</div>
      <div style="font-size:14.5px;font-weight:800;margin-top:3px;letter-spacing:-.2px;">ระบบบริหารการบริการ</div>
      <div style="font-size:10.5px;color:{{ sub }};margin-top:2px;">Service Management System</div>
    </div>
    <div style="flex:1;overflow:auto;padding:8px;min-height:0;">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
        <div style="margin:6px 6px 2px;">
          <span style="font-size:9px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:5px;background:{{ g.badgeBg }};color:{{ g.badgeFg }};">{{ g.label }}</span>
        </div>
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
          <button onClick="{{ it.onClick }}" style="{{ it.style }}">
            <span style="font-size:12.5px;font-weight:{{ it.weight }};">{{ it.th }}</span>
            <span style="display:flex;align-items:center;gap:6px;">
              <sc-if value="{{ it.dis }}" hint-placeholder-val="{{ false }}">
                <span style="font-size:8px;font-weight:700;letter-spacing:.4px;padding:2px 5px;border-radius:5px;background:#e5484d;color:#fff;">ปิด</span>
              </sc-if>
              <sc-if value="{{ it.hid }}" hint-placeholder-val="{{ false }}">
                <span style="font-size:8px;font-weight:700;letter-spacing:.4px;padding:2px 5px;border-radius:5px;background:{{ border }};color:{{ sub }};">HIDDEN</span>
              </sc-if>
              <span style="font-size:9.5px;font-weight:700;color:{{ it.abbrColor }};">{{ it.abbr }}</span>
            </span>
          </button>
        </sc-for>
      </sc-for>
    </div>
  </aside>
  <main style="flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;">
    <sc-if value="{{ is_scat }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-CAT" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.scat.onCatalog }}" on-mode="{{ handlers.scat.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_sreq }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-SR" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.sreq.onCatalog }}" on-mode="{{ handlers.sreq.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_sord }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-SO" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.sord.onCatalog }}" on-mode="{{ handlers.sord.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_word }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-WO" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.word.onCatalog }}" on-mode="{{ handlers.word.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_task }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-TASK" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.task.onCatalog }}" on-mode="{{ handlers.task.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_rsch }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-SCH" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.rsch.onCatalog }}" on-mode="{{ handlers.rsch.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_tmex }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-TE" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.tmex.onCatalog }}" on-mode="{{ handlers.tmex.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_scon }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-SC" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.scon.onCatalog }}" on-mode="{{ handlers.scon.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_slam }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-SLA" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.slam.onCatalog }}" on-mode="{{ handlers.slam.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_sbil }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-SB" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.sbil.onCatalog }}" on-mode="{{ handlers.sbil.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_scmp }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-COMP" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.scmp.onCatalog }}" on-mode="{{ handlers.scmp.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_help }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-HD" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.help.onCatalog }}" on-mode="{{ handlers.help.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_tick }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-TKT" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.tick.onCatalog }}" on-mode="{{ handlers.tick.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_fsvc }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-FSM" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.fsvc.onCatalog }}" on-mode="{{ handlers.fsvc.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_appt }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-APT" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.appt.onCatalog }}" on-mode="{{ handlers.appt.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_pjms }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-PM" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.pjms.onCatalog }}" on-mode="{{ handlers.pjms.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_mntn }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-MNT" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.mntn.onCatalog }}" on-mode="{{ handlers.mntn.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_cprt }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-CP" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.cprt.onCatalog }}" on-mode="{{ handlers.cprt.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_msvc }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-MS" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.msvc.onCatalog }}" on-mode="{{ handlers.msvc.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_knwb }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-KB" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.knwb.onCatalog }}" on-mode="{{ handlers.knwb.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ is_rpta }}" hint-placeholder-val="{{ false }}">
      <dc-import name="SRVC-RPTA" theme="{{ theme }}" api="{{ api }}" win="{{ win }}" on-catalog="{{ handlers.rpta.onCatalog }}" on-mode="{{ handlers.rpta.onMode }}" hint-size="100%,100%"></dc-import>
    </sc-if>
    <sc-if value="{{ hasConfirm }}" hint-placeholder-val="{{ false }}">
      <div style="position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,0.32);display:flex;align-items:center;justify-content:center;padding:20px;">
        <div style="background:{{ panel }};border-radius:14px;border:1px solid {{ border }};box-shadow:0 20px 60px rgba(0,0,0,0.25);width:400px;max-width:100%;padding:22px 24px;">
          <div style="font-size:15.5px;font-weight:800;margin-bottom:10px;">ออกจากหน้านี้โดยไม่บันทึก?</div>
          <div style="font-size:12.5px;color:{{ sub }};line-height:1.6;margin-bottom:18px;">โมดูล {{ confirmFromTh }} มีการแก้ไขที่ยังไม่ได้บันทึก การสลับไปยัง {{ confirmToTh }} จะละทิ้งการเปลี่ยนแปลงนี้</div>
          <div style="display:flex;justify-content:flex-end;gap:8px;">
            <button onClick="{{ cancelSwitch }}" style="padding:8px 16px;border-radius:9px;border:1px solid {{ border }};background:{{ panel }};color:{{ fg }};font-weight:600;font-size:12.5px;cursor:pointer;font-family:inherit;">ยกเลิก</button>
            <button onClick="{{ confirmSwitchAction }}" style="padding:8px 16px;border-radius:9px;border:none;background:{{ acc }};color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;">ไม่บันทึกและสลับ</button>
          </div>
        </div>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;theme&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;api&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;win&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  state = { active: 'srvc-scat', catalogs: {}, modes: {}, confirm: null };
  MODKEYS = { 'srvc-scat':'scat','srvc-sreq':'sreq','srvc-sord':'sord','srvc-word':'word','srvc-task':'task','srvc-rsch':'rsch','srvc-tmex':'tmex','srvc-scon':'scon','srvc-slam':'slam','srvc-sbil':'sbil','srvc-scmp':'scmp','srvc-help':'help','srvc-tick':'tick','srvc-fsvc':'fsvc','srvc-appt':'appt','srvc-pjms':'pjms','srvc-mntn':'mntn','srvc-cprt':'cprt','srvc-msvc':'msvc','srvc-knwb':'knwb','srvc-rpta':'rpta' };
  BUILT = ['srvc-scat','srvc-sreq','srvc-sord','srvc-word','srvc-task','srvc-rsch','srvc-tmex','srvc-scon','srvc-slam','srvc-sbil','srvc-scmp','srvc-help','srvc-tick','srvc-fsvc','srvc-appt','srvc-pjms','srvc-mntn','srvc-cprt','srvc-msvc','srvc-knwb','srvc-rpta'];
  _handlers = {};
  mkHandlers(key) {
    if (this._handlers[key]) return this._handlers[key];
    const h = {
      onCatalog: (cat) => this.setState(s => ({ catalogs: Object.assign({}, s.catalogs, { [key]: cat }) })),
      onMode: (m) => this.setState(s => ({ modes: Object.assign({}, s.modes, { [key]: m }) })),
    };
    this._handlers[key] = h;
    return h;
  }
  requestSwitch(id) {
    if (id === this.state.active) return;
    const curKey = this.MODKEYS[this.state.active];
    const dirty = curKey && (this.state.modes[curKey] === 'create' || this.state.modes[curKey] === 'edit');
    if (dirty) this.setState({ confirm: id }); else this.setState({ active: id });
  }
  confirmSwitch() { const id = this.state.confirm; this.setState({ active: id, confirm: null }); }
  cancelSwitch() { this.setState({ confirm: null }); }

  // ---- SRVC submodule registry (mirrors Shell's MODULES/SRVC_GEN) ----
  SUBS() {
    return [
      ['srvc-scat','CAT','จัดการรายการบริการ','core',false,false],
      ['srvc-sreq','SR','จัดการคำขอรับบริการ','core',false,false],
      ['srvc-sord','SO','จัดการคำสั่งงานบริการ','core',false,false],
      ['srvc-word','WO','จัดการใบสั่งงาน','core',false,false],
      ['srvc-task','TASK','บริหารงานและภารกิจ','core',false,false],
      ['srvc-rsch','SCH','วางแผนและจัดสรรทรัพยากร','core',false,false],
      ['srvc-tmex','TE','บันทึกเวลาและค่าใช้จ่าย','core',false,false],
      ['srvc-scon','SC','บริหารสัญญาบริการ','core',false,false],
      ['srvc-slam','SLA','บริหารข้อตกลงระดับการให้บริการ','core',false,false],
      ['srvc-sbil','SB','เรียกเก็บค่าบริการ','core',false,false],
      ['srvc-scmp','COMP','ปิดงานบริการ','core',false,false],
      ['srvc-help','HD','ศูนย์บริการลูกค้า','ext',false,false],
      ['srvc-tick','TKT','จัดการทิกเก็ต','ext',false,false],
      ['srvc-fsvc','FSM','บริการภาคสนาม','ext',false,false],
      ['srvc-appt','APT','บริหารการนัดหมาย','ext',false,false],
      ['srvc-pjms','PM','บริหารโครงการบริการ','ext',false,false],
      ['srvc-mntn','MNT','บริหารงานบำรุงรักษา','ext',false,false],
      ['srvc-cprt','CP','พอร์ทัลลูกค้า','ext',false,false],
      ['srvc-msvc','MS','บริการผ่านอุปกรณ์เคลื่อนที่','ext',false,false],
      ['srvc-knwb','KB','ฐานความรู้','ext',false,false],
      ['srvc-rpta','RPTA','รายงานและการวิเคราะห์','report',false,false],
    ];
  }

  T() { return this.props.theme || {}; }

  renderVals() {
    const T = this.T();
    const dark = T.name === 'dark';
    const acc = T.acc || 'oklch(0.55 0.16 255)';
    const bg = T.bg || (dark ? 'oklch(0.19 0.012 265)' : 'oklch(0.98 0.004 255)');
    const panel = T.card || (dark ? 'oklch(0.23 0.014 265)' : '#fff');
    const fg = T.text || (dark ? 'oklch(0.94 0.01 265)' : 'oklch(0.25 0.02 265)');
    const sub = T.sub || (dark ? 'oklch(0.68 0.02 265)' : 'oklch(0.55 0.02 265)');
    const border = T.border || (dark ? 'oklch(0.32 0.014 265)' : 'oklch(0.9 0.006 255)');
    const accSoft = T.accSoft || (dark ? 'rgba(120,160,255,.16)' : 'rgba(60,110,240,.10)');

    const TYPE = {
      core:   ['Core Functions', dark?'rgba(90,140,255,.18)':'oklch(0.95 0.05 220)', dark?'oklch(0.8 0.1 220)':'oklch(0.45 0.15 220)'],
      ext:    ['Extensions',     dark?'rgba(80,200,140,.18)':'oklch(0.95 0.05 158)', dark?'oklch(0.82 0.1 158)':'oklch(0.45 0.15 158)'],
      report: ['Reports & Analytics', dark?'rgba(240,180,90,.18)':'oklch(0.95 0.05 35)', dark?'oklch(0.84 0.1 60)':'oklch(0.5 0.15 45)'],
    };
    const subs = this.SUBS();
    const active = this.state.active;
    const showHidden = this.props.showHidden !== undefined ? !!this.props.showHidden : true;
    const mk = (mt) => subs.filter(s => s[3] === mt && (showHidden || !s[4])).map(([id, abbr, th, , hid, dis]) => {
      const on = id === active;
      return {
        th, abbr, hid: !!hid, dis: !!dis,
        weight: on ? 700 : 500,
        abbrColor: on ? acc : sub,
        style: `display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:none;cursor:pointer;font-family:inherit;padding:8px 10px;border-radius:9px;margin:1px 0;color:${on?fg:sub};background:${on?accSoft:'transparent'};opacity:${dis?0.5:(hid?0.62:1)};`,
        onClick: () => this.requestSwitch(id),
      };
    });
    const groups = [['core'],['ext'],['report']].map(([mt]) => ({
      label: TYPE[mt][0], badgeBg: TYPE[mt][1], badgeFg: TYPE[mt][2], items: mk(mt),
    })).filter(g => g.items.length);

    const cur = subs.find(s => s[0] === active) || subs[0];
    const api = this.props.api || {};
    const handlers = {};
    Object.keys(this.MODKEYS).forEach(k => { handlers[this.MODKEYS[k]] = this.mkHandlers(this.MODKEYS[k]); });
    const confirmId = this.state.confirm;
    const confirmFrom = confirmId ? (subs.find(s => s[0] === active) || subs[0]) : null;
    const confirmTo = confirmId ? (subs.find(s => s[0] === confirmId) || subs[0]) : null;
    return {
      handlers,
      hasConfirm: !!confirmId,
      confirmFromTh: confirmFrom ? confirmFrom[2] : '',
      confirmToTh: confirmTo ? confirmTo[2] : '',
      cancelSwitch: () => this.cancelSwitch(),
      confirmSwitchAction: () => this.confirmSwitch(),
      bg, fg, sub, panel, border, acc,
      groups,
      themeName: T.name || '(ยังไม่ได้ส่ง theme)',
      activeTh: cur[2],
      activeAbbr: cur[1],
      activeCrumb: 'L1 · SRVC › L2 · ' + ({core:'Core Functions',ext:'Extensions',report:'Reports & Analytics'}[cur[3]]) + ' › L3 · ' + cur[2],
      is_scat: active === 'srvc-scat',
      is_sreq: active === 'srvc-sreq',
      is_sord: active === 'srvc-sord',
      is_word: active === 'srvc-word',
      is_task: active === 'srvc-task',
      is_rsch: active === 'srvc-rsch',
      is_tmex: active === 'srvc-tmex',
      is_scon: active === 'srvc-scon',
      is_slam: active === 'srvc-slam',
      is_sbil: active === 'srvc-sbil',
      is_scmp: active === 'srvc-scmp',
      is_help: active === 'srvc-help',
      is_tick: active === 'srvc-tick',
      is_fsvc: active === 'srvc-fsvc',
      is_appt: active === 'srvc-appt',
      is_pjms: active === 'srvc-pjms',
      is_mntn: active === 'srvc-mntn',
      is_cprt: active === 'srvc-cprt',
      is_msvc: active === 'srvc-msvc',
      is_knwb: active === 'srvc-knwb',
      is_rpta: active === 'srvc-rpta',
      showHidden,
      theme: this.props.theme,
      api: this.props.api,
      win: this.props.win,
    };
  }
}
</script>
</body>
</html>
