  _seed() { if (this._sheetsPulled && !this._seeded && this.state.db.provider === undefined) { this._seeded = true; const rows = this.PROV(); this.setState(s => ({ db: Object.assign({}, s.db, { provider: rows }) })); } }
  componentDidMount() { this._loadAI(); if (this.K) { this._reportMode(); this._reportCatalog(); this._db(); return; } import('./erp-kit.js?v=7').then(m => { const K = m.createKit(React); window.__erpKit = K; this.K = K; this.setState({ ready: true }); this._reportCatalog(); this._db(); this._loadAI(); }); }
  _loadAI() {

  componentDidUpdate() { this._db(); this._reportMode(); this._reportCatalog(); this._handleReq(); this._aiSync(); }
  // ---- per-provider credentials (sheet columns: auth / apiKey / proxyUrl / endpoint / keyUpdated) ----
  AUTH_MODES(p) {
    const k = p.kind || 'Commercial API';
    if (k === 'Open-weight · Self-hosted') return [['none','ไม่ต้องรับรองสิทธิ์','เซิร์ฟเวอร์อยู่ในเครือข่ายองค์กร'],['key','Bearer Token','เซิร์ฟเวอร์ที่เปิด auth']];

    return [['relay','Apps Script Relay','คีย์เก็บฝั่ง server — แนะนำสำหรับ deploy'],['key','API Key ในเบราว์เซอร์','ง่ายสุด แต่คีย์อยู่ฝั่งผู้ใช้']];
  }
  fmtStamp(v) { if (!v) return ''; const s = String(v); if (!/T\d\d:/.test(s)) return s;
    const d = new Date(s); if (isNaN(d)) return s; const p2 = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
  credOf(p) {

    let auth = p.auth || (live ? (live.provider === 'proxy' ? 'relay' : (live.apiKey ? 'key' : (live.proxyUrl ? 'relay' : null))) : null) || this.AUTH_MODES(p)[0][0];
    const guess = /claude|anthropic/i.test(p.id + ' ' + p.model) ? 'anthropic' : (/gemini/i.test(p.id + ' ' + p.model) ? 'gemini' : 'openai');
    return {
      auth,
      api: p.api || guess,
      apiKey: p.apiKey || (live && live.apiKey) || '',

      endpoint: p.endpoint || host,

  credState(p) { const d = this.credOf(p);
    if (d.auth === 'none') return ['ไม่ต้องใช้คีย์', '#1ba94c'];
    if (d.apiKey) return ['ตั้งค่าคีย์แล้ว', '#1ba94c'];
    if (d.proxyUrl) return ['ตั้งค่า Relay แล้ว', '#1ba94c'];

  }
  // เดารูปแบบ API · ปลายทาง · โมเดล จากหน้าตาของคีย์ที่วาง
  detectKey(k) {
    k = String(k || '').trim();
    if (/^sk-ant-/.test(k)) return { api:'anthropic', endpoint:'api.anthropic.com', model:'claude-sonnet-4-5', name:'Claude (Anthropic)' };

  }
  async quickConnect() {
    const d = this.state.credDraft || {};
    const det = this.detectKey(d.apiKey);

    if (r.ok) { this.setState({ credPrimary: true }); await this.saveCred({ primary: true }); }

  }
  openCred(p, tab) { this._loadAI(); this.setState({ credId: p.id, credTab: tab || 'quick', credDraft: Object.assign({ name:p.name, kind:p.kind, cost:p.cost || '', note:p.note || '' }, this.credOf(p)), credShow: false, credMsg: null, credTest: null }); }
  setCd(k, v) { this.setState(s => ({ credDraft: Object.assign({}, s.credDraft, { [k]: v }), credMsg: null })); }
  async saveCred(opts) {

      if (this._sheetsLast) this._sheetsLast.provider = JSON.stringify(rows);
      this.setState({ sheetsStatus:'connected', credMsg: ['ok','บันทึกลงชีต ' + this.SHEETS_TABS.provider + ' แล้ว · ' + stamp + (wantPrimary ? ' · ตั้งเป็นผู้ให้บริการหลักของระบบ' : ' · ยังไม่ได้ตั้งเป็นผู้ให้บริการหลัก (ผู้ช่วย AI จะยังใช้เจ้าเดิม)')] });

  async testCred() {
    const p = this.allProv().find(x => x.id === this.state.credId); if (!p) return;
    const d = this.state.credDraft || {};

    { id:'claude', name:'Claude (Anthropic)', kind:'Commercial API', hue:265, ic:'spark', model:'claude-sonnet-4-5', host:'api.anthropic.com', status:'connected', latency:'0.9s', cost:'จ่ายตาม token', note:'คุณภาพสูง เหมาะงานที่ต้องใช้เหตุผลและภาษาสละสลวย', on:true },
